# Local dependencies. The application service is added with the Dockerfile on day 6.
#   docker compose up -d postgres
#   export AGENT_REPLAY_DATABASE_URL=postgresql://agent_replay:agent_replay@localhost:5432/agent_replay
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent_replay
      POSTGRES_PASSWORD: agent_replay  # local development only
      POSTGRES_DB: agent_replay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_replay"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
