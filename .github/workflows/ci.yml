name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_replay
          POSTGRES_PASSWORD: agent_replay
          POSTGRES_DB: agent_replay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_replay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_REPLAY_TEST_DATABASE_URL: postgresql://agent_replay:agent_replay@localhost:5432/agent_replay_test
      # Fail instead of silently skipping the PostgreSQL tests if the service is missing.
      AGENT_REPLAY_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install
        run: uv pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check
        run: mypy

      - name: Tests
        run: pytest --cov=agent_replay --cov-report=term --junitxml=junit.xml

      - name: Replay smoke test
        run: agent-replay demo --out-dir "$RUNNER_TEMP/demo"

      - name: Ingest smoke test (OTLP file into PostgreSQL)
        run: |
          agent-replay record --task "Please refund ORD-1003." \
            --out "$RUNNER_TEMP/run.json" --otlp-out "$RUNNER_TEMP/spans.json"
          agent-replay ingest "$RUNNER_TEMP/spans.json" --database-url "$AGENT_REPLAY_TEST_DATABASE_URL"
          agent-replay stats --database-url "$AGENT_REPLAY_TEST_DATABASE_URL"
