name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_replay
          POSTGRES_PASSWORD: agent_replay
          POSTGRES_DB: agent_replay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_replay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_REPLAY_TEST_DATABASE_URL: postgresql://agent_replay:agent_replay@localhost:5432/agent_replay_test
      # Fail instead of silently skipping the PostgreSQL tests if the service is missing.
      AGENT_REPLAY_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install
        run: uv pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check
        run: mypy

      - name: Tests
        run: pytest --cov=agent_replay --cov-report=term --junitxml=junit.xml

      - name: Replay smoke test
        run: agent-replay demo --out-dir "$RUNNER_TEMP/demo"

      - name: Diff smoke test (a seeded regression must diverge and be localised)
        run: |
          task="I'd like a refund for ORD-1001, it arrived damaged."
          agent-replay record --task "$task" --out "$RUNNER_TEMP/base.json"
          agent-replay record --task "$task" --out "$RUNNER_TEMP/again.json"
          agent-replay diff "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/again.json"
          set +e
          agent-replay replay "$RUNNER_TEMP/base.json" --policy amount-drift \
            --diff-out "$RUNNER_TEMP/diff.md" > "$RUNNER_TEMP/replay.json"
          code=$?
          set -e
          test "$code" -eq 1
          grep -q 'First divergence:\*\* `argument_drift`' "$RUNNER_TEMP/diff.md"
          cat "$RUNNER_TEMP/diff.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Scoring smoke test (a seeded unsafe write must fail the scorecard)
        run: |
          agent-replay score "$RUNNER_TEMP/base.json" --baseline "$RUNNER_TEMP/base.json"
          set +e
          agent-replay replay "$RUNNER_TEMP/base.json" --policy skip-lookup \
            --unrecorded-writes block --out "$RUNNER_TEMP/unsafe.json" > /dev/null
          agent-replay score "$RUNNER_TEMP/unsafe.json" --baseline "$RUNNER_TEMP/base.json" \
            --out "$RUNNER_TEMP/scorecard.md"
          code=$?
          set -e
          test "$code" -eq 1
          grep -q 'lookup_before_refund' "$RUNNER_TEMP/scorecard.md"
          cat "$RUNNER_TEMP/scorecard.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Gate (an identical candidate passes; a seeded unsafe regression breaches)
        run: |
          agent-replay suite record --out-dir "$RUNNER_TEMP/suite"
          agent-replay gate --baseline "$RUNNER_TEMP/suite" --junit "$RUNNER_TEMP/gate-pass.xml"
          set +e
          agent-replay gate --baseline "$RUNNER_TEMP/suite" --policy skip-lookup \
            --junit "$RUNNER_TEMP/gate-breach.xml" --markdown "$RUNNER_TEMP/gate.md" > /dev/null
          code=$?
          set -e
          test "$code" -eq 1
          grep -q '| unsafe_actions | BREACH |' "$RUNNER_TEMP/gate.md"
          cat "$RUNNER_TEMP/gate.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Regression-detection eval
        run: |
          agent-replay eval --out-dir evals/results
          cat evals/results/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results/

      - name: Ingest smoke test (OTLP file into PostgreSQL)
        run: |
          agent-replay record --task "Please refund ORD-1003." \
            --out "$RUNNER_TEMP/run.json" --otlp-out "$RUNNER_TEMP/spans.json"
          agent-replay ingest "$RUNNER_TEMP/spans.json" --database-url "$AGENT_REPLAY_TEST_DATABASE_URL"
          agent-replay stats --database-url "$AGENT_REPLAY_TEST_DATABASE_URL"
